[package]
# Registry name only. The crates.io name `ares` belongs to an unrelated
# third-party crate, so this publishes as `ares-solid` while the library keeps
# its `ares` module path — the convention `proteus-mat` and `gaia-mesh` follow.
name = "ares-solid"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Solid momentum balance: kinematics, stress, equilibrium, and boundary conditions"
repository = "https://github.com/ryancinsight/ares"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["solid-mechanics", "elasticity", "finite-element", "multiphysics"]
categories = ["science", "simulation"]
publish = true

[lib]
# Import path stays `ares` regardless of the registry name above.
name = "ares"
path = "src/lib.rs"

[dependencies]
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas", default-features = false }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
proteus = { package = "proteus-mat", version = "0.1.0", git = "https://github.com/ryancinsight/proteus", default-features = false }

[dev-dependencies]
proptest = "1.11.0"

[features]
default = ["std"]
std = ["aequitas/std", "eunomia/std", "proteus/std"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor from the first commit: the crate starts pedantic-clean, so
# there is no allow-list and no ratchet. A new hit is fixed, never allowed.

# --- Restriction floor ---
# Solid mechanics is input-dependent throughout, so a panicking path is a
# defect rather than an inconvenience. Library output belongs to the caller.
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# --- Not denied here, and why ---
# `indexing_slicing` and `arithmetic_side_effects` were denied crate-wide in
# the scaffold commit. That was wrong: those are trust-boundary and parser
# lints, and this is a compute kernel. They fired on `ONE + ONE` for a generic
# float, which cannot wrap or panic, and on `a[i][j]` into a `[[T; D]; D]`
# whose bounds are fixed by the const generic and proven by the iterator that
# produced the index.
#
# The concern that motivated them is real - a wrong index in assembly yields a
# plausible wrong stiffness matrix - but the mitigation is structural, not a
# lint: bounds are elided by iterating rather than indexing wherever the access
# is data-driven, and the patch test catches an assembly that indexes wrongly.
# A module that ever parses untrusted input carries these as a module-scoped
# `deny` instead.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.release]
debug = false
strip = "symbols"
