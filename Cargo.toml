[workspace]
members = ["crates/*"]
resolver = "3"

# Why a workspace, per ADR 0001 in this repository: `ares` is `#![no_std]` and
# depends on nothing but vocabulary crates, while Athena's operator seam is
# reachable only through `athena-leto`, which links `std`. One crate would have
# to give up `no_std` - or hide the solver behind a feature, which makes the
# shipped path the untested one. Two keep the domain core free of
# infrastructure and the dependency direction inward.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/ares"
publish = true

[workspace.dependencies]
ares = { package = "ares-solid", version = "0.1.0", path = "crates/ares", default-features = false }
ares-operator = { version = "0.1.0", path = "crates/ares-operator" }
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas", default-features = false }
athena-core = { version = "0.1.1", git = "https://github.com/ryancinsight/athena", default-features = false }
athena-leto = { version = "0.1.1", git = "https://github.com/ryancinsight/athena", default-features = false }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
harmonia = { version = "0.1.0", git = "https://github.com/ryancinsight/harmonia", default-features = false }
leto = { version = "0.43.0", git = "https://github.com/ryancinsight/leto", features = ["std"] }
leto-ops = { version = "0.43.0", git = "https://github.com/ryancinsight/leto", features = ["std"] }
proteus = { package = "proteus-mat", version = "0.1.0", git = "https://github.com/ryancinsight/proteus", default-features = false }
proptest = "1.11.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor from the first commit: the crates start pedantic-clean, so
# there is no allow-list and no ratchet. A new hit is fixed, never allowed.

# --- Restriction floor ---
# Solid mechanics is input-dependent throughout, so a panicking path is a
# defect rather than an inconvenience. Library output belongs to the caller.
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# --- Not denied here, and why ---
# `indexing_slicing` and `arithmetic_side_effects` were denied crate-wide in
# the scaffold commit. That was wrong: those are trust-boundary and parser
# lints, and this is a compute kernel. They fired on `ONE + ONE` for a generic
# float, which cannot wrap or panic, and on `a[i][j]` into a `[[T; D]; D]`
# whose bounds are fixed by the const generic and proven by the iterator that
# produced the index.
#
# The concern that motivated them is real - a wrong index in assembly yields a
# plausible wrong stiffness matrix - but the mitigation is structural, not a
# lint: bounds are elided by iterating rather than indexing wherever the access
# is data-driven, and the patch test catches an assembly that indexes wrongly.
# A module that ever parses untrusted input carries these as a module-scoped
# `deny` instead.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.release]
debug = false
strip = "symbols"
