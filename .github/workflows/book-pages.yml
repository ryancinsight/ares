name: Deploy mdBook

on:
  push:
    branches: [main]
    paths: ["docs/book/**", ".github/workflows/book-pages.yml"]
  pull_request:
    paths: ["docs/book/**", ".github/workflows/book-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  # Deploys queue behind one another; a half-cancelled deploy is worse than a
  # superseded one, and a cancelled default-branch run leaves that merge
  # undeployed.
  cancel-in-progress: false

jobs:
  deploy:
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/ares
      mdbook-test: true
      rust-toolchain: "1.97.0"
      # The registry name is `ares-solid`; bare `ares` on crates.io belongs to
      # an unrelated third-party crate, so `cargo package -p ares` matches
      # nothing.
      cargo-package: ares-solid
      # The [lib] target keeps the `ares` name — that is the point of the
      # rename — so the shared workflow must stage `libares-*.rlib` for
      # `mdbook test --library-path`. Deriving the crate name from the package
      # would look for `libares_solid-*` and stage nothing, leaving every
      # `extern crate ares;` book sample failing to resolve.
      cargo-crate: ares
