name: Crates.io Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # Three crates ship from this repository, so the package the release gate
  # checks cannot be a constant. The tag carries it; this job is the only
  # place that parses it, and every later job reads these outputs rather than
  # re-deriving them from the tag and risking two readings.
  identify:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    permissions:
      contents: read
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse the release tag
        id: parse
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ "$RELEASE_TAG" =~ ^crate-(.+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
              package="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[2]}"
            else
              echo "release tag must be crate-<package>-v<version>" >&2
              exit 1
            fi
          else
            package="$INPUT_PACKAGE"
            version="$INPUT_VERSION"
          fi
          if [[ ! "$package" =~ ^(ares-solid|ares-operator|ares-coupling)$ ]]; then
            echo "unknown package for this repository: $package" >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A public-surface break the manifest version does not cover
  # stops the release here. The baseline is the latest published
  # version, so the list is the crates the registry carries.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate (release)
    needs: identify
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@744acdf83a51aeeff23a45ef3c26f460ba5f9587
    with:
      release-gate: true
      package: ${{ needs.identify.outputs.package }}
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  validate:
    needs: [identify, semver]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    name: Validate crate package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Validate the release identity against the manifest
        id: release
        shell: bash
        env:
          # Parsed once, in `identify`. Re-deriving it here would be a second
          # reading of the tag that could disagree with the one the SemVer
          # gate already ran against.
          RELEASE_PACKAGE: ${{ needs.identify.outputs.package }}
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
        run: |
          set -euo pipefail
          package="$RELEASE_PACKAGE"
          version="$RELEASE_VERSION"
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          matches="$(jq --arg package "$package" '[.packages[] | select(.name == $package)] | length' <<<"$metadata")"
          if [[ "$matches" != "1" ]]; then
            echo "expected exactly one workspace package named $package; found $matches" >&2
            exit 1
          fi
          manifest_version="$(jq -r --arg package "$package" '.packages[] | select(.name == $package) | .version' <<<"$metadata")"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "release version $version does not match Cargo version $manifest_version" >&2
            exit 1
          fi
          publishable="$(jq -r --arg package "$package" '.packages[] | select(.name == $package) | (.publish == null or (.publish | index("crates-io") != null))' <<<"$metadata")"
          if [[ "$publishable" != "true" ]]; then
            echo "Cargo metadata marks $package as publish = false" >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package and verify without publishing
        shell: bash
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
        run: cargo publish --locked --package "$RELEASE_PACKAGE" --dry-run

  publish:
    if: github.event_name == 'release'
    needs: [identify, validate]
    name: Publish crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.validate.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Request a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the validated package
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_PACKAGE: ${{ needs.validate.outputs.package }}
        run: cargo publish --locked --package "$RELEASE_PACKAGE"
